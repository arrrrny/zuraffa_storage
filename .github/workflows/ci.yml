name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout companion repo
        uses: actions/checkout@v4

      - name: Checkout core zuraffa into the workspace
        uses: actions/checkout@v4
        with:
          repository: arrrrny/zuraffa
          path: zuraffa-core

      - name: Point the zuraffa override at the CI core checkout
        run: sed -i 's|path: \.\./zuraffa|path: zuraffa-core|' pubspec.yaml

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.x'

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test
