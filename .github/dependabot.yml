# Dependabot for the pub ecosystem, weekly.
#
# Meaningful advisory/updates require the committed pubspec.lock — the lockfile
# is the reviewed, scannable resolution Dependabot diffs against. The fleet is
# mono-versioned, so a dep bump here is a candidate for the next fleet bump
# rather than a standalone release.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Fleet mono-versioning: arrrrny/zuraffa's scripts/update_fleet.sh owns
      # these two constraints (zuraffa_storage is in FLEET_REPOS) and pushes
      # them straight to master — Dependabot would only race it with a PR
      # against an already-stale base.
      - dependency-name: "zuraffa"
      - dependency-name: "zuraffa_minio"
