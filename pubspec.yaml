name: zuraffa_storage
description: S3/MinIO storage capability for Zuraffa — MinioClient and the artifact-upload hooks (optional companion package; issue #1661).
version: 0.1.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  minio: ^3.5.8
  logging: ^1.3.0
  zuraffa: ^7.0.0

dev_dependencies:
  test: ^1.25.0

dependency_overrides:
  zuraffa:
    path: ../zuraffa
